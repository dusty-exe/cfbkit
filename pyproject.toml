[project]
name = "cfbkit"
version = "0.1.0"
description = "College football play-by-play data layer and expected-points models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
